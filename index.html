<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IT中心系统主数据</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --blue-dark:#1e4080;--blue-light:#dbeafe;
  --green-dark:#1b5e20;--green-light:#dcfce7;
  --purple-dark:#4527a0;--purple-light:#ede9fe;
  --amber-dark:#92400e;--amber-light:#fef3c7;
  --pink-dark:#880e4f;--pink-light:#fce7f3;
  --gray-dark:#37474f;--gray-light:#f1f5f9;
  --bg:#f5f7fa;--card:#fff;--border:#e2e8f0;
  --text:#0f172a;--muted:#64748b;--muted2:#94a3b8;
}
body{font-family:-apple-system,'PingFang SC',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* ── Header ── */
.hdr{background:#1e2235;color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:flex-start}
.hdr-title{font-size:17px;font-weight:600;line-height:1.3}
.hdr-sub{font-size:12px;color:#94a3b8;margin-top:3px}
.hdr-date{font-size:11px;color:#64748b;white-space:nowrap;margin-top:2px}

/* ── Search ── */
.search-wrap{position:sticky;top:0;z-index:20;background:#fff;padding:10px 16px;border-bottom:1px solid var(--border);box-shadow:0 1px 4px rgba(0,0,0,.06)}
.search-box{display:flex;align-items:center;gap:8px;background:#f8fafc;border:1px solid var(--border);border-radius:10px;padding:9px 14px}
.search-box input{border:none;background:transparent;font-size:15px;flex:1;color:var(--text);outline:none;min-width:0}
.search-box input::placeholder{color:var(--muted2)}
.search-box svg{flex-shrink:0;color:var(--muted)}
.clr-btn{background:none;border:none;cursor:pointer;color:var(--muted);padding:0;display:none;line-height:1}

/* ── Unit tabs ── */
.units-wrap{background:#fff;border-bottom:1px solid var(--border);overflow-x:auto;-webkit-overflow-scrolling:touch}
.units-wrap::-webkit-scrollbar{display:none}
.units{display:flex;gap:4px;padding:10px 16px;width:max-content}
.utab{padding:5px 14px;border-radius:99px;border:1px solid var(--border);font-size:13px;cursor:pointer;white-space:nowrap;background:#fff;color:var(--muted);transition:.15s;user-select:none}
.utab.active{color:#fff;border-color:transparent;font-weight:500}
.utab:not(.active):hover{background:var(--bg)}

/* ── Stats ── */
.stats{display:flex;gap:10px;padding:14px 16px;background:#fff;border-bottom:1px solid var(--border)}
.stat{flex:1;text-align:center;padding:8px 0}
.stat-n{font-size:22px;font-weight:600;line-height:1;color:var(--text)}
.stat-l{font-size:11px;color:var(--muted);margin-top:3px}

/* ── Toolbar ── */
.toolbar{display:flex;justify-content:flex-end;gap:8px;padding:10px 16px}
.tbtn{display:flex;align-items:center;gap:5px;padding:6px 12px;border:1px solid var(--border);border-radius:8px;background:#fff;font-size:12px;color:var(--muted);cursor:pointer;transition:.15s}
.tbtn:hover{background:var(--bg);color:var(--text)}
.tbtn svg{width:14px;height:14px}

/* ── Main content ── */
.content{max-width:900px;margin:0 auto;padding:0 12px 32px}
.unit-group{margin-bottom:4px}
.unit-hdr{font-size:11px;font-weight:600;letter-spacing:.06em;padding:14px 4px 6px;display:flex;align-items:center;gap:6px}
.unit-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}

/* ── System card ── */
.sys-card{background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden}
.sys-head{padding:13px 15px;cursor:pointer;display:flex;align-items:flex-start;gap:10px;user-select:none}
.sys-head:active{background:#f8fafc}
.sys-left{flex:1;min-width:0}
.sys-name{font-size:15px;font-weight:600;line-height:1.3;margin-bottom:4px;word-break:break-all}
.sys-brief{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sys-code{font-family:ui-monospace,monospace;font-size:11px;background:#f1f5f9;padding:1px 6px;border-radius:4px;color:#475569}
.sys-right{display:flex;align-items:center;gap:6px;flex-shrink:0;padding-top:1px}
.ubadge{font-size:11px;padding:3px 9px;border-radius:99px;font-weight:500;white-space:nowrap}
.chevron{width:20px;height:20px;border:1px solid var(--border);border-radius:5px;display:flex;align-items:center;justify-content:center;background:#f8fafc;transition:transform .2s;flex-shrink:0}
.chevron.open{transform:rotate(180deg)}

/* ── Children strip (collapsed) ── */
.children-strip{padding:0 15px 10px;display:flex;flex-direction:column;gap:3px;border-top:1px solid #f1f5f9}
.child-row{display:flex;align-items:baseline;gap:6px;padding:4px 0 4px 10px;border-left:2px solid #e2e8f0;font-size:12px}
.child-arrow{color:var(--muted2);flex-shrink:0}
.child-name{color:var(--text);font-weight:500}
.child-code{font-family:ui-monospace,monospace;font-size:10px;color:var(--muted2)}

/* ── Detail panel (expanded) ── */
.sys-detail{border-top:1px solid var(--border);background:#f8fafc}
.detail-sec{padding:12px 15px;border-bottom:1px solid #f0f0f0}
.detail-sec:last-child{border-bottom:none}
.detail-sec-title{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:8px}
.detail-row{display:flex;gap:8px;margin-bottom:6px;font-size:13px;align-items:flex-start}
.detail-row:last-child{margin-bottom:0}
.detail-k{color:var(--muted);min-width:80px;flex-shrink:0;line-height:1.5}
.detail-v{color:var(--text);flex:1;line-height:1.5;word-break:break-all}
.detail-mono{font-family:ui-monospace,monospace;font-size:12px}

/* ── Child detail cards ── */
.child-cards{display:flex;flex-direction:column;gap:6px}
.child-card{background:#fff;border:1px solid var(--border);border-radius:8px;padding:10px 12px}
.child-card-name{font-size:13px;font-weight:600;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.child-tag{font-size:10px;padding:1px 7px;border-radius:99px;font-weight:500}

/* ── Name search results ── */
.name-results{padding:12px 0}
.name-hdr{font-size:13px;color:var(--muted);padding:4px 0 10px}
.role-section{background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden}
.role-label{font-size:12px;font-weight:600;padding:10px 15px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.role-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.role-item{padding:10px 15px;border-bottom:1px solid #f5f5f5;display:flex;justify-content:space-between;align-items:center}
.role-item:last-child{border-bottom:none}
.role-sys-name{font-size:14px;font-weight:500}
.role-unit{font-size:11px;padding:2px 8px;border-radius:99px}

/* ── Empty ── */
.empty{text-align:center;padding:48px 20px;color:var(--muted)}
.empty svg{margin-bottom:12px;opacity:.4}
.empty p{font-size:14px}

/* ── Loading ── */
.loading{text-align:center;padding:60px 20px;color:var(--muted);font-size:14px}

/* ── Desktop adjustments ── */
@media (min-width:768px){
  .hdr{padding:20px 32px}
  .hdr-title{font-size:20px}
  .hdr-sub{font-size:13px}
  .search-wrap{padding:12px 24px}
  .units{padding:10px 24px}
  .stats{padding:16px 24px}
  .stats .stat-n{font-size:28px}
  .toolbar{padding:12px 24px}
  .content{padding:0 20px 40px}
  .sys-name{font-size:16px}
  .sys-detail{display:grid;grid-template-columns:1fr 1fr;gap:0}
  .sys-detail .detail-sec:not(:last-child){border-right:1px solid #f0f0f0;border-bottom:none}
}

/* ── Print ── */
@media print{
  .search-wrap,.units-wrap,.toolbar{display:none!important}
  .hdr{background:#1e2235!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .sys-card{break-inside:avoid;border:1px solid #ccc!important}
  .chevron{display:none}
  .sys-detail{display:block!important}
  body{background:#fff}
}
</style>
</head>
<body>

<div class="hdr">
  <div>
    <div class="hdr-title" id="site-title">IT中心系统主数据</div>
    <div class="hdr-sub" id="site-subtitle">福建电信企业信息化中心（大数据和AI中心）</div>
  </div>
  <div class="hdr-date" id="hdr-date">加载中…</div>
</div>

<div class="search-wrap">
  <div class="search-box">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
    <input id="q" type="search" placeholder="搜索系统名称 / 姓名 / 编码 / 牵头单元…" oninput="onSearch()" autocomplete="off" autocorrect="off">
    <button class="clr-btn" id="clr-btn" onclick="clearSearch()" aria-label="清除搜索">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
</div>

<div class="units-wrap"><div class="units" id="units"></div></div>

<div class="stats" id="stats">
  <div class="stat"><div class="stat-n">—</div><div class="stat-l">主系统</div></div>
  <div class="stat"><div class="stat-n">—</div><div class="stat-l">子系统</div></div>
  <div class="stat"><div class="stat-n">—</div><div class="stat-l">合计</div></div>
</div>

<div class="toolbar">
  <button class="tbtn" onclick="exportCSV()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    导出CSV
  </button>
  <button class="tbtn" onclick="window.print()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
    打印/PDF
  </button>
</div>

<div class="content" id="content"><div class="loading">数据加载中…</div></div>

<script>
const UNIT_ORDER = ['结构室','保障室','云网室','计费室','运营室'];
const UNIT_CFG = {
  '结构室':{dark:'#1e4080',light:'#dbeafe'},
  '保障室':{dark:'#1b5e20',light:'#dcfce7'},
  '云网室':{dark:'#4527a0',light:'#ede9fe'},
  '计费室':{dark:'#92400e',light:'#fef3c7'},
  '运营室':{dark:'#880e4f',light:'#fce7f3'},
  '其他':  {dark:'#37474f',light:'#f1f5f9'},
};
function ucfg(u){ return UNIT_CFG[u]||UNIT_CFG['其他']; }
function unitOf(s){ return UNIT_ORDER.includes(s.unit)?s.unit:'其他'; }

let ALL=[], META={}, activeUnit='全部', expanded=new Set(), searchQ='';

fetch('./data.json').then(r=>r.json()).then(d=>{
  ALL=d.systems||[]; META=d.meta||{};
  document.getElementById('site-title').textContent=META.site_title||'IT中心系统主数据';
  document.getElementById('site-subtitle').textContent=META.site_subtitle||'';
  document.getElementById('hdr-date').textContent='更新：'+(META.exported_at||'').slice(0,10);
  render();
}).catch(e=>{
  document.getElementById('content').innerHTML=
    '<div class="empty"><p>数据加载失败，请检查 data.json 是否存在</p></div>';
});

function unitCounts(){
  const c={'全部':0};
  ALL.forEach(s=>{const u=unitOf(s);c[u]=(c[u]||0)+1;c['全部']++;});
  return c;
}

function setUnit(u){ activeUnit=u; render(); }

function onSearch(){
  searchQ=document.getElementById('q').value.trim();
  document.getElementById('clr-btn').style.display=searchQ?'block':'none';
  render();
}
function clearSearch(){ document.getElementById('q').value=''; searchQ=''; document.getElementById('clr-btn').style.display='none'; render(); }

function toggleExpand(id){
  expanded.has(id)?expanded.delete(id):expanded.add(id);
  render();
}

function render(){
  renderTabs();
  renderStats();
  renderContent();
}

function renderTabs(){
  const cc=unitCounts();
  const tabs=['全部',...UNIT_ORDER,'其他'].filter(u=>cc[u]>0||u==='全部');
  document.getElementById('units').innerHTML=tabs.map(u=>{
    const isActive=activeUnit===u;
    const uc=ucfg(u);
    return `<div class="utab${isActive?' active':''}"
      style="${isActive&&u!=='全部'?'background:'+uc.dark+';':''}"
      onclick="setUnit('${u}')">${u} ${cc[u]||0}</div>`;
  }).join('');
}

function renderStats(){
  let filtered=filterSystems();
  const main=filtered.length;
  const child=filtered.reduce((a,s)=>a+s.children.length,0);
  document.getElementById('stats').innerHTML=
    `<div class="stat"><div class="stat-n">${main}</div><div class="stat-l">主系统</div></div>
     <div class="stat"><div class="stat-n">${child}</div><div class="stat-l">子系统</div></div>
     <div class="stat"><div class="stat-n">${main+child}</div><div class="stat-l">合计</div></div>`;
}

function filterSystems(){
  let list=ALL;
  if(activeUnit!=='全部') list=list.filter(s=>unitOf(s)===activeUnit);
  if(searchQ){
    const q=searchQ.toLowerCase();
    list=list.filter(s=>
      s.name.toLowerCase().includes(q)||
      (s.code||'').toLowerCase().includes(q)||
      (s.filing||'').toLowerCase().includes(q)||
      (s.unit||'').toLowerCase().includes(q)||
      s.children.some(c=>c.name.toLowerCase().includes(q))
    );
  }
  return list;
}

function isPersonSearch(){
  if(searchQ.length<2) return null;
  const q=searchQ.toLowerCase();
  const people=new Set();
  ALL.forEach(s=>{
    [s.pm,s.req,s.ops].forEach(p=>{ if(p) people.add(p); });
    s.children.forEach(c=>{ [c.pm,c.req,c.ops].forEach(p=>{ if(p) people.add(p); }); });
  });
  return [...people].find(p=>p.toLowerCase().includes(q))||null;
}

function renderContent(){
  const el=document.getElementById('content');

  // 姓名搜索模式
  const person=isPersonSearch();
  if(person&&searchQ.length>=2){
    const groups={项目经理:[],需求经理:[],运营负责人:[]};
    ALL.forEach(s=>{
      if(s.pm===person) groups['项目经理'].push({name:s.name,unit:s.unit});
      if(s.req===person) groups['需求经理'].push({name:s.name,unit:s.unit});
      if(s.ops===person) groups['运营负责人'].push({name:s.name,unit:s.unit});
      s.children.forEach(c=>{
        if(c.pm===person) groups['项目经理'].push({name:c.name,unit:c.unit,child:true});
        if(c.req===person) groups['需求经理'].push({name:c.name,unit:c.unit,child:true});
        if(c.ops===person) groups['运营负责人'].push({name:c.name,unit:c.unit,child:true});
      });
    });
    const total=Object.values(groups).flat().length;
    const roleColor={项目经理:'#1e4080',需求经理:'#1b5e20',运营负责人:'#92400e'};
    let html=`<div class="name-results"><div class="name-hdr">"${person}" 参与的系统（共 ${total} 个）</div>`;
    Object.entries(groups).forEach(([role,items])=>{
      if(!items.length) return;
      const rc=roleColor[role];
      html+=`<div class="role-section">
        <div class="role-label" style="color:${rc}">
          <span class="role-dot" style="background:${rc}"></span>${role}（${items.length}个）
        </div>`;
      items.forEach(it=>{
        const uc=ucfg(it.unit);
        html+=`<div class="role-item">
          <div class="role-sys-name">${it.child?'↳ ':''} ${it.name}</div>
          <span class="role-unit" style="background:${uc.light};color:${uc.dark}">${it.unit||'其他'}</span>
        </div>`;
      });
      html+='</div>';
    });
    if(!total) html+='<div class="empty"><p>未找到相关系统</p></div>';
    html+='</div>';
    el.innerHTML=html;
    return;
  }

  // 系统列表模式
  const filtered=filterSystems();
  if(!filtered.length){
    el.innerHTML='<div class="empty"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/><line x1="8" y1="11" x2="14" y2="11"/></svg><p>无匹配结果</p></div>';
    return;
  }

  // 按单元分组
  const groups={};
  filtered.forEach(s=>{ const u=unitOf(s); if(!groups[u])groups[u]=[]; groups[u].push(s); });
  const order=activeUnit==='全部'?[...UNIT_ORDER,'其他']:[activeUnit];

  let html='';
  order.forEach(unit=>{
    if(!groups[unit]) return;
    const uc=ucfg(unit);
    html+=`<div class="unit-group">
      <div class="unit-hdr" style="color:${uc.dark}">
        <span class="unit-dot" style="background:${uc.dark}"></span>${unit}（${groups[unit].length}个）
      </div>`;
    groups[unit].forEach(s=>{
      const exp=expanded.has(s.id);
      html+=renderCard(s,exp,uc);
    });
    html+='</div>';
  });
  el.innerHTML=html;
}

function renderCard(s,exp,uc){
  let h=`<div class="sys-card" id="card-${s.id}">
    <div class="sys-head" onclick="toggleExpand(${s.id})" role="button" aria-expanded="${exp}">
      <div class="sys-left">
        <div class="sys-name">${esc(s.name)}</div>
        <div class="sys-brief">
          ${s.code?`<span class="sys-code">${esc(s.code)}</span>`:''}
          <span>项目经理：${esc(s.pm||'—')}</span>
        </div>
      </div>
      <div class="sys-right">
        <span class="ubadge" style="background:${uc.light};color:${uc.dark}">${esc(s.unit||'其他')}</span>
        <div class="chevron${exp?' open':''}">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
      </div>
    </div>`;

  if(!exp&&s.children.length){
    h+=`<div class="children-strip">`;
    s.children.forEach(c=>{
      h+=`<div class="child-row">
        <span class="child-arrow">↳</span>
        <span class="child-name">${esc(c.name)}</span>
        ${c.code?`<span class="child-code">${esc(c.code)}</span>`:''}
      </div>`;
    });
    h+=`</div>`;
  }

  if(exp){
    h+=`<div class="sys-detail">
      <div class="detail-sec">
        <div class="detail-sec-title">系统信息</div>
        <div class="detail-row"><span class="detail-k">系统编码</span><span class="detail-v detail-mono">${esc(s.code||'—')}</span></div>
        <div class="detail-row"><span class="detail-k">定级备案</span><span class="detail-v" style="font-size:12px">${esc(s.filing||'—')}</span></div>
      </div>
      <div class="detail-sec">
        <div class="detail-sec-title">责任人</div>
        <div class="detail-row"><span class="detail-k">项目经理</span><span class="detail-v">${esc(s.pm||'—')}</span></div>
        <div class="detail-row"><span class="detail-k">需求经理</span><span class="detail-v">${esc(s.req||'—')}</span></div>
        <div class="detail-row"><span class="detail-k">运营负责人</span><span class="detail-v">${esc(s.ops||'—')}</span></div>
      </div>`;

    if(s.children.length){
      h+=`<div class="detail-sec" style="grid-column:1/-1">
        <div class="detail-sec-title">子系统（${s.children.length}个）</div>
        <div class="child-cards">`;
      s.children.forEach(c=>{
        h+=`<div class="child-card">
          <div class="child-card-name">
            <span class="child-tag" style="background:${uc.light};color:${uc.dark}">子系统</span>
            ${esc(c.name)}
          </div>
          <div class="detail-row"><span class="detail-k">系统编码</span><span class="detail-v detail-mono" style="font-size:11px">${esc(c.code||'—')}</span></div>
          <div class="detail-row"><span class="detail-k">定级备案</span><span class="detail-v" style="font-size:11px">${esc(c.filing||'—')}</span></div>
          <div class="detail-row"><span class="detail-k">项目经理</span><span class="detail-v">${esc(c.pm||'—')}</span></div>
          <div class="detail-row"><span class="detail-k">需求经理</span><span class="detail-v">${esc(c.req||'—')}</span></div>
          <div class="detail-row"><span class="detail-k">运营负责人</span><span class="detail-v">${esc(c.ops||'—')}</span></div>
        </div>`;
      });
      h+=`</div></div>`;
    }
    h+='</div>';
  }
  h+='</div>';
  return h;
}

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function exportCSV(){
  const rows=[['层级','ITSM系统名称','父系统','系统编码','定级备案系统名称','牵头单元','项目经理','需求经理','运营负责人']];
  const filtered=filterSystems();
  filtered.forEach(s=>{
    rows.push(['主系统',s.name,'',s.code||'',s.filing||'',s.unit||'',s.pm||'',s.req||'',s.ops||'']);
    s.children.forEach(c=>{
      rows.push(['子系统',c.name,s.name,c.code||'',c.filing||'',c.unit||'',c.pm||'',c.req||'',c.ops||'']);
    });
  });
  const csv='\uFEFF'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');
  const a=document.createElement('a');
  a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);
  a.download='IT中心系统主数据_'+new Date().toISOString().slice(0,10)+'.csv';
  a.click();
}
</script>
